[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cgra-ii-predictor"
version = "0.1.0"
description = "CGRA compiled-II prediction and static-shape ranking"
requires-python = ">=3.8"
dependencies = ["torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The pinned Neura dependency has its own Python tests and plugin stack.  Keep
# this repository's unit-test command scoped to the predictor package.
testpaths = ["tests"]
addopts = "-p no:pytest-pymtl3"
